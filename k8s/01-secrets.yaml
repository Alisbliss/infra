# Fill DB_USERNAME/DB_PASSWORD and the JWT RSA keys (base64 PKCS8 / X509, as in infra/.env) - see k8s/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: microservices
type: Opaque
stringData:
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
  namespace: microservices
type: Opaque
stringData:
  JWT_PRIVATE_KEY: "REPLACE_WITH_BASE64_PKCS8_PRIVATE_KEY"
  JWT_PUBLIC_KEY: "REPLACE_WITH_BASE64_X509_PUBLIC_KEY"
